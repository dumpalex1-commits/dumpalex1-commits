<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 130" width="100%" height="130" role="img" aria-labelledby="nameTitle nameDesc">
  <title id="nameTitle">Alex L. Berin</title>
  <desc id="nameDesc">Full-stack Development, Cloud Engineering, Solutions Architecture</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap');
      .name {
        font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 5px;
        fill: #C41E3A;
        text-transform: uppercase;
      }
      .role {
        font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 3.5px;
