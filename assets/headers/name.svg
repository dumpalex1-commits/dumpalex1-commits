  <circle cx="270" cy="78" r="2.5" class="tick" />
  <circle cx="680" cy="78" r="2.5" class="tick" />
  <text x="50%" y="106" dominant-baseline="middle" text-anchor="middle" class="role">FULL-STACK ENGINEERING — CLOUD ARCHITECTURE — SYSTEMS DESIGN</text>
